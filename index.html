<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#ffffff" />
<title>Training</title>
<style>
:root{
  --canvas:#FFFFFF; --surface:#F9F8F7; --surface2:#F0EFED; --border:#E6E5E3;
  --text:#2C2C2B; --muted:#7D7A75;
  --blue:#2783DE; --blue-soft:#E5F2FC;
  --green:#46A171; --green-soft:#E8F1EC;
  --orange:#D5803B; --orange-soft:#FBEBDE;
  --red:#E56458;
  --r:8px; --r-lg:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    --canvas:#191919; --surface:#202020; --surface2:#383836; --border:rgba(255,255,255,.20);
    --text:#FFFFFF; --muted:rgba(255,255,255,.65);
    --blue:#5E9FE8; --blue-soft:rgba(94,159,232,.12);
    --green:#72BC8F; --green-soft:rgba(114,188,143,.12);
    --orange:#DE9255; --orange-soft:rgba(222,146,85,.12);
    --red:#E97366;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--canvas); color:var(--text);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
.wrap{max-width:560px;margin:0 auto;padding:20px 20px 8px}
h1{font-size:26px;line-height:1.2;margin:0;letter-spacing:-.02em}
h2{font-size:15px;margin:0 0 10px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600}
h3{font-size:18px;margin:0 0 4px;letter-spacing:-.01em}
p{margin:0}
.sub{color:var(--muted);font-size:14px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--blue-soft);color:var(--blue);
  font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;white-space:nowrap}
.chip.grey{background:var(--surface2);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:16px}
.card.accent{background:var(--canvas);border-color:var(--blue);box-shadow:0 1px 2px rgba(0,0,0,.05),0 4px 12px rgba(0,0,0,.04)}
.week{display:flex;gap:6px;margin-bottom:20px}
.day{flex:1;min-width:0;height:60px;border:1px solid var(--border);background:var(--canvas);border-radius:var(--r);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:0}
.day span{font-size:12px;color:var(--muted);font-weight:600}
.day b{font-size:15px;color:var(--text);font-weight:600}
.day.sel{border-color:var(--blue);background:var(--blue-soft)}
.day.sel span,.day.sel b{color:var(--blue)}
.day .dot{width:6px;height:6px;border-radius:50%;background:var(--border)}
.day .dot.done{background:var(--green)}
.day .dot.rest{background:transparent}
.ex{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.ex:first-of-type{border-top:0}
.ex .name{flex:1;min-width:0}
.ex .name b{display:block;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex .name b a{color:var(--text);text-decoration:none;border-bottom:1px solid var(--blue);padding-bottom:1px}
.ex .name span{font-size:13px;color:var(--muted)}
input[type=number],input[type=date],input[type=text]{
  font:15px/1 inherit;color:var(--text);background:var(--canvas);border:1px solid var(--border);
  border-radius:var(--r);padding:11px 10px;width:100%;min-height:44px;-moz-appearance:textfield}
input:focus{outline:2px solid var(--blue);outline-offset:1px}
input.num{width:76px;flex:0 0 76px;text-align:center;padding-left:6px;padding-right:6px}
.unit{font-size:12px;color:var(--muted);width:76px;flex:0 0 76px;text-align:center;display:block;margin-bottom:4px}
.ex .name{overflow:hidden}
.btn{display:block;width:100%;min-height:48px;border-radius:var(--r);border:1px solid var(--blue);
  background:var(--blue);color:#fff;font:600 16px/1 inherit;cursor:pointer;padding:15px 12px;margin-top:14px}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.done{background:var(--green);border-color:var(--green)}
.btn.small{min-height:44px;font-size:15px;padding:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px}
.tile .v{font-size:24px;font-weight:650;letter-spacing:-.02em;display:block;line-height:1.15}
.tile .k{font-size:13px;color:var(--muted);display:block;margin-top:2px}
.tile .d{font-size:12px;font-weight:600;margin-top:4px;display:block}
.up{color:var(--green)} .down{color:var(--blue)} .flat{color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.03em;text-transform:uppercase}
td:first-child,th:first-child{padding-left:0}
td:last-child,th:last-child{padding-right:0;text-align:right}
.row{display:flex;gap:10px;align-items:flex-end}
.row>div{flex:1;min-width:0}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--canvas);
  border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;min-height:56px;background:none;border:0;color:var(--muted);font:600 12px/1.4 inherit;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px}
nav button.on{color:var(--blue)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chart{width:100%;height:auto;display:block;overflow:visible}
.empty{color:var(--muted);font-size:14px;padding:18px 0;text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.hide{display:none}
a{color:var(--blue)}
.sched{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--border);align-items:baseline}
.sched:first-of-type{border-top:0}
.sched b{width:40px;flex:none;font-size:14px}
.sched .t{flex:1;font-size:15px}
.sched .m{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:99px}
@media (prefers-reduced-motion:no-preference){.btn,.day{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<nav>
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/></svg>Today</button>
  <button data-tab="body"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Weigh-in</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-5 3 3 4-6"/></svg>Progress</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
</nav>

<script>
"use strict";
/* ---------------- storage ---------------- */
var KEY="trainer_v1", mem=null;
function load(){
  if(mem) return mem;
  try{ mem=JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ mem={}; }
  mem.sessions=mem.sessions||{}; mem.metrics=mem.metrics||[]; mem.weights=mem.weights||{};
  return mem;
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(mem)); }catch(e){} }

/* ---------------- dates ---------------- */
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parse(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function addDays(s,n){ var d=parse(s); d.setDate(d.getDate()+n); return iso(d); }
function dow(s){ return (parse(s).getDay()+6)%7; } /* 0=Mon */
function monday(s){ return addDays(s,-dow(s)); }
function fmt(s){ return parse(s).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"}); }
function shortD(s){ return parse(s).toLocaleDateString(undefined,{day:"numeric",month:"short"}); }
function daysBetween(a,b){ return Math.round((parse(b)-parse(a))/86400000); }

var P1_START="2026-09-28", P1_END="2026-10-25", WEDDING="2026-10-25",
    P2_START="2026-10-26", P2_END="2026-12-20";

/* ---------------- plan ---------------- */
var MS="https://www.muscleandstrength.com/exercises/";
function ex(n,s,w,u){ return {n:n,s:s,w:w,u:u?MS+u:null}; }
var LIFTS={
  A:{name:"Strength A",ex:[ex("Goblet squat","3 × 10",14,"dumbbell-goblet-squat"),ex("Flat bench press","3 × 8",10,"dumbbell-bench-press.html"),ex("One-arm row","3 × 10 / side",12,"one-arm-dumbbell-row.html"),ex("Overhead press","3 × 8",7,"seated-dumbbell-press.html"),ex("Romanian deadlift","3 × 10",12,"dumbbell-stiff-leg-deadlift.html"),ex("Plank","3 × 40 sec",null,"hover.html")]},
  B:{name:"Strength B",ex:[ex("Reverse lunge","3 × 8 / side",8,"dumbbell-rear-lunge.html"),ex("Bent-over row","3 × 10",10,"bent-over-dumbbell-row.html"),ex("Incline bench press","3 × 10",9,"incline-dumbbell-bench-press.html"),ex("Pullover","3 × 12",10,"dumbbell-pullover.html"),ex("Incline curl","3 × 12",8,"incline-dumbbell-curl.html"),ex("Triceps extension","3 × 12",8,"two-arm-dumbbell-extension.html"),ex("Side plank","2 × 30 sec",null,"side-hover.html")]},
  UA:{name:"Upper A",ex:[ex("Flat bench press","4 × 8",10,"dumbbell-bench-press.html"),ex("Overhead press","3 × 8",7,"seated-dumbbell-press.html"),ex("One-arm row","4 × 10",12,"one-arm-dumbbell-row.html"),ex("Lateral raise","3 × 15",5,"dumbbell-lateral-raise.html"),ex("Incline curl","3 × 10",8,"incline-dumbbell-curl.html"),ex("Lying triceps ext.","3 × 12",8,"lying-dumbbell-extension.html")]},
  UB:{name:"Upper B",ex:[ex("Bent-over row","4 × 8",12,"bent-over-dumbbell-row.html"),ex("Incline bench press","4 × 10",9,"incline-dumbbell-bench-press.html"),ex("Chest-supported row","3 × 12",10,"chest-supported-dumbbell-row"),ex("Pullover","3 × 12",10,"dumbbell-pullover.html"),ex("Rear-delt fly","3 × 15",5,"bent-over-dumbbell-reverse-fly.html"),ex("Hammer curl","3 × 12",8,"standing-hammer-curl.html")]},
  LO:{name:"Lower + core",ex:[ex("Goblet squat","4 × 10",16,"dumbbell-goblet-squat"),ex("Romanian deadlift","4 × 8",14,"dumbbell-stiff-leg-deadlift.html"),ex("Bulgarian split squat","3 × 10 / side",8,"one-leg-dumbbell-squat-aka-bulgarian-squat.html"),ex("Hip thrust","3 × 12",16,"barbell-hip-thrust"),ex("Calf raise","3 × 15",12,"standing-one-leg-calf-raise-with-dumbbell.html"),ex("Plank","3 × 60 sec",null,"hover.html")]}
};
var RUNS={
  easy:{name:"Easy run",detail:"6 km, conversational pace",km:6},
  intervals:{name:"Intervals",detail:"1.5 km warm-up · 6 × 2 min hard / 2 min jog · 1.5 km cool-down",km:8},
  steady:{name:"Steady run",detail:"8–10 km, comfortably hard in the back half",km:9},
  long:{name:"Long run",detail:"10–14 km, easy effort throughout",km:12}
};
function phase(d){
  if(d<P1_START) return 0;
  if(d<=P1_END) return 1;
  if(d<=P2_END) return 2;
  return 3;
}
function sessionFor(d){
  var ph=phase(d), k=dow(d);
  if(ph===3){ /* maintenance */
    if(k===0) return {id:"UA",kind:"lift",lift:"UA"};
    if(k===4) return {id:"LO",kind:"lift",lift:"LO"};
    if(k===5) return {id:"easy",kind:"run",run:"easy"};
    return {id:"rest",kind:"rest"};
  }
  if(ph===2){
    if(k===0) return {id:"UA",kind:"lift",lift:"UA"};
    if(k===1) return {id:"easy",kind:"run",run:"easy"};
    if(k===2) return {id:"LO",kind:"lift",lift:"LO"};
    if(k===3) return {id:"intervals",kind:"run",run:"intervals"};
    if(k===4) return {id:"UB",kind:"lift",lift:"UB"};
    if(k===5) return {id:"long",kind:"run",run:"long"};
    return {id:"rest",kind:"rest"};
  }
  /* phase 1 (and anything before it) */
  var wk=Math.floor(daysBetween(monday(P1_START),monday(d))/7), odd=((wk%2)+2)%2===1;
  if(k===0) return {id:odd?"B":"A",kind:"lift",lift:odd?"B":"A",extra:"Finish with 10 min easy row"};
  if(k===1) return {id:"easy",kind:"run",run:"easy"};
  if(k===2) return {id:odd?"A":"B",kind:"lift",lift:odd?"A":"B"};
  if(k===3) return {id:"intervals",kind:"run",run:"intervals",extra:"Swap for 8 × 1 min rower intervals if the legs are sore"};
  if(k===4) return {id:odd?"B":"A",kind:"lift",lift:odd?"B":"A"};
  if(k===5) return {id:"steady",kind:"run",run:"steady"};
  return {id:"rest",kind:"rest"};
}
function phaseLabel(d){
  var p=phase(d);
  return p<=1?"Phase 1 · Wedding sprint":p===2?"Phase 2 · Strength & definition":"Maintenance mode";
}

/* ---------------- helpers ---------------- */
function lastWeight(name,fallback){
  var s=load(); return (s.weights[name]!==undefined&&s.weights[name]!==null)?s.weights[name]:fallback;
}
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function sessionsInWeek(mon){
  var s=load(),n=0,l=0,r=0;
  for(var i=0;i<7;i++){ var d=addDays(mon,i), e=s.sessions[d];
    if(e&&e.done){ n++; if(e.kind==="lift") l++; else if(e.kind==="run") r++; } }
  return {total:n,lifts:l,runs:r};
}
function metricsSorted(){ return load().metrics.slice().sort(function(a,b){ return a.date<b.date?-1:1; }); }

/* ---------------- charts ---------------- */
function lineChart(series,opts){
  opts=opts||{};
  var W=520,H=opts.h||170,L=38,R=10,T=12,B=26;
  var all=[],labels=[];
  series.forEach(function(s){ s.pts.forEach(function(p){ all.push(p.v); }); });
  if(!all.length) return "";
  var min=Math.min.apply(null,all), max=Math.max.apply(null,all);
  if(max-min<0.6){ var m=(max+min)/2; min=m-0.5; max=m+0.5; }
  var pad=(max-min)*0.15; min-=pad; max+=pad;
  var n=Math.max.apply(null,series.map(function(s){return s.pts.length;}));
  function X(i){ return n<2?L+(W-L-R)/2:L+i*(W-L-R)/(n-1); }
  function Y(v){ return T+(H-T-B)*(1-(v-min)/(max-min)); }
  var g="";
  for(var t=0;t<=2;t++){
    var v=min+(max-min)*t/2, y=Y(v);
    g+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="var(--border)" stroke-width="1"/>'+
       '<text x="'+(L-7)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+v.toFixed(opts.dp===0?0:1)+'</text>';
  }
  series.forEach(function(s){
    var dpath=s.pts.map(function(p,i){ return (i?"L":"M")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1); }).join(" ");
    g+='<path d="'+dpath+'" fill="none" stroke="'+s.color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
    s.pts.forEach(function(p,i){ g+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3" fill="'+s.color+'"/>'; });
  });
  var f=series[0].pts;
  if(f.length){
    g+='<text x="'+L+'" y="'+(H-6)+'" font-size="11" fill="var(--muted)">'+esc(shortD(f[0].d))+'</text>';
    if(f.length>1) g+='<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+esc(shortD(f[f.length-1].d))+'</text>';
  }
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">'+g+'</svg>';
}
function barChart(bars,target){
  var W=520,H=150,L=8,R=8,T=12,B=26, n=bars.length;
  if(!n) return "";
  var max=Math.max(target||0,Math.max.apply(null,bars.map(function(b){return b.v;})),1);
  var bw=(W-L-R)/n, g="";
  if(target){ var ty=T+(H-T-B)*(1-target/max);
    g+='<line x1="'+L+'" y1="'+ty.toFixed(1)+'" x2="'+(W-R)+'" y2="'+ty.toFixed(1)+'" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4"/>';
    g+='<text x="'+(W-R)+'" y="'+(ty-5).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--muted)">target '+target+'</text>'; }
  bars.forEach(function(b,i){
    var h=(H-T-B)*(b.v/max), x=L+i*bw+bw*0.2, y=H-B-h;
    g+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw*0.6).toFixed(1)+'" height="'+Math.max(h,1).toFixed(1)+'" rx="3" fill="'+(b.v>=(target||0)?"var(--green)":"var(--blue)")+'"/>';
    if(b.v) g+='<text x="'+(x+bw*0.3).toFixed(1)+'" y="'+(y-5).toFixed(1)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+b.v+'</text>';
    g+='<text x="'+(x+bw*0.3).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+esc(b.k)+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">'+g+'</svg>';
}

/* ---------------- views ---------------- */
var tab="today", sel=iso(new Date());

function viewToday(){
  var s=load(), ses=sessionFor(sel), entry=s.sessions[sel]||{}, h="";
  var toW=daysBetween(iso(new Date()),WEDDING);
  h+='<div class="top"><div><h1>'+esc(fmt(sel).replace(/^./,function(c){return c.toUpperCase();}))+'</h1>'+
     '<p class="sub">'+esc(phaseLabel(sel))+'</p></div>'+
     (toW>=0?'<span class="chip">'+toW+'d to wedding</span>':'<span class="chip grey">'+Math.abs(toW)+'d after</span>')+'</div>';

  /* week strip */
  var mon=monday(sel);
  h+='<div class="week">';
  for(var i=0;i<7;i++){
    var d=addDays(mon,i), e=s.sessions[d]||{}, sk=sessionFor(d);
    h+='<button class="day'+(d===sel?" sel":"")+'" data-d="'+d+'" aria-label="'+esc(fmt(d))+'">'+
       '<span>'+["M","T","W","T","F","S","S"][i]+'</span><b>'+parse(d).getDate()+'</b>'+
       '<i class="dot'+(e.done?" done":(sk.kind==="rest"?" rest":""))+'"></i></button>';
  }
  h+='</div>';

  if(ses.kind==="rest"){
    h+='<div class="card accent"><h3>Rest day</h3><p class="sub">Nothing scheduled. A walk is a fine idea; so is doing nothing at all.</p></div>';
    var wk=sessionsInWeek(mon);
    h+='<div class="card"><h2>This week</h2><p><b style="font-size:22px">'+wk.total+'</b> <span class="sub">of 6 sessions · '+wk.lifts+' lifts, '+wk.runs+' runs</span></p>'+
       '<div class="bar"><i style="width:'+Math.min(100,wk.total/6*100)+'%"></i></div></div>';
    return h;
  }

  h+='<div class="card accent">';
  if(ses.kind==="lift"){
    var L=LIFTS[ses.lift];
    h+='<h3>'+esc(L.name)+'</h3><p class="sub">Rest 90 seconds between sets'+(ses.extra?" · "+esc(ses.extra):"")+' · tap a name for the technique video</p><div style="height:12px"></div>';
    h+='<div class="row" style="justify-content:flex-end;margin-bottom:-4px"><div style="flex:1"></div><span class="unit">kg</span><span class="unit">reps</span></div>';
    L.ex.forEach(function(e,i){
      var log=(entry.ex||{})[e.n]||{};
      var w=log.w!==undefined?log.w:(e.w===null?"":lastWeight(e.n,e.w));
      var label=e.u?'<a href="'+e.u+'" target="_blank" rel="noopener">'+esc(e.n)+'</a>':esc(e.n);
      h+='<div class="ex"><div class="name"><b>'+label+'</b><span>'+esc(e.s)+'</span></div>'+
         '<input class="num" type="number" inputmode="decimal" step="0.5" min="0" data-ex="'+esc(e.n)+'" data-f="w" value="'+(w===""?"":w)+'" placeholder="'+(e.w===null?"–":"")+'" aria-label="'+esc(e.n)+' weight in kg"'+(e.w===null?" disabled":"")+'>'+
         '<input class="num" type="number" inputmode="numeric" step="1" min="0" data-ex="'+esc(e.n)+'" data-f="r" value="'+(log.r!==undefined?log.r:"")+'" placeholder="–" aria-label="'+esc(e.n)+' reps">'+
         '</div>';
    });
  } else {
    var R=RUNS[ses.run];
    h+='<h3>'+esc(R.name)+'</h3><p class="sub">'+esc(R.detail)+'</p>'+(ses.extra?'<p class="note">'+esc(ses.extra)+'</p>':'')+'<div style="height:14px"></div>';
    h+='<div class="row"><div><label for="rk">Distance (km)</label><input id="rk" type="number" inputmode="decimal" step="0.1" min="0" value="'+(entry.km!==undefined?entry.km:"")+'" placeholder="'+R.km+'"></div>'+
       '<div><label for="rt">Time (min)</label><input id="rt" type="number" inputmode="numeric" step="1" min="0" value="'+(entry.min!==undefined?entry.min:"")+'" placeholder="–"></div></div>';
  }
  h+='<button class="btn'+(entry.done?" done":"")+'" id="mark">'+(entry.done?"Done ✓":"Mark complete")+'</button>';
  if(entry.done) h+='<button class="btn ghost small" id="undo">Undo</button>';
  h+='</div>';

  var wk2=sessionsInWeek(mon);
  h+='<div class="card"><h2>This week</h2><p><b style="font-size:22px">'+wk2.total+'</b> <span class="sub">of 6 sessions · '+wk2.lifts+' lifts, '+wk2.runs+' runs</span></p>'+
     '<div class="bar"><i style="width:'+Math.min(100,wk2.total/6*100)+'%"></i></div>'+
     '<p class="note">'+(wk2.lifts>=2&&wk2.runs>=1?"Minimum viable week already banked. Everything else is upside.":"Minimum viable week: 2 lifts + 1 run.")+'</p></div>';
  return h;
}

function viewBody(){
  var m=metricsSorted(), h="";
  h+='<div class="top"><div><h1>Weigh-in</h1><p class="sub">Same time of day, ideally before breakfast</p></div></div>';
  h+='<div class="card"><div class="row" style="margin-bottom:12px"><div><label for="md">Date</label><input id="md" type="date" value="'+iso(new Date())+'"></div></div>'+
     '<div class="grid2">'+
     '<div><label for="mw">Weight (kg)</label><input id="mw" type="number" inputmode="decimal" step="0.1" min="0" placeholder="–"></div>'+
     '<div><label for="mf">Body fat (%)</label><input id="mf" type="number" inputmode="decimal" step="0.1" min="0" placeholder="–"></div>'+
     '<div><label for="mm">Muscle mass (kg)</label><input id="mm" type="number" inputmode="decimal" step="0.1" min="0" placeholder="–"></div>'+
     '<div><label for="mh">Water (%)</label><input id="mh" type="number" inputmode="decimal" step="0.1" min="0" placeholder="–"></div>'+
     '</div><button class="btn" id="saveM">Save reading</button></div>';

  h+='<div class="card"><h2>Import from Apple Health</h2>'+
     '<p class="sub">Use the Health Auto Export app (or any CSV with a date column) to export body measurements, then drop the file in here. Columns are matched automatically.</p>'+
     '<input type="file" id="imp" accept=".csv,.json,text/csv,application/json" style="margin-top:12px;font-size:14px">'+
     '<p class="note" id="impMsg"></p></div>';

  h+='<div class="card"><h2>History</h2>';
  if(!m.length){ h+='<p class="empty">No readings yet.</p>'; }
  else{
    h+='<table><thead><tr><th>Date</th><th>kg</th><th>Fat %</th><th>Muscle</th></tr></thead><tbody>';
    m.slice(-12).reverse().forEach(function(r){
      h+='<tr><td>'+esc(shortD(r.date))+'</td><td>'+(r.w!=null?r.w:"–")+'</td><td>'+(r.f!=null?r.f:"–")+'</td><td>'+(r.mm!=null?r.mm:"–")+'</td>'+
         '<td><button class="btn ghost small" style="width:auto;padding:6px 10px;margin:0;border:0" data-del="'+r.date+'" aria-label="Delete '+esc(r.date)+'">Delete</button></td></tr>';
    });
    h+='</tbody></table>';
  }
  h+='</div>';
  return h;
}

function viewProgress(){
  var s=load(), m=metricsSorted(), h="";
  h+='<div class="top"><div><h1>Progress</h1><p class="sub">The numbers that tell you it is working</p></div></div>';

  var first=m[0], last=m[m.length-1];
  function delta(k,dp,inv){
    if(!first||!last||first===last||first[k]==null||last[k]==null) return '<span class="d flat">—</span>';
    var v=last[k]-first[k]; if(Math.abs(v)<0.05) return '<span class="d flat">no change</span>';
    var good=inv?v<0:v>0;
    return '<span class="d '+(good?"up":"down")+'">'+(v>0?"+":"")+v.toFixed(dp)+' since start</span>';
  }
  h+='<div class="grid2" style="margin-bottom:16px">'+
     '<div class="tile"><span class="v">'+(last&&last.w!=null?last.w+"<span style=\"font-size:14px;font-weight:500\"> kg</span>":"–")+'</span><span class="k">Weight</span>'+delta("w",1,true)+'</div>'+
     '<div class="tile"><span class="v">'+(last&&last.mm!=null?last.mm+"<span style=\"font-size:14px;font-weight:500\"> kg</span>":"–")+'</span><span class="k">Muscle mass</span>'+delta("mm",1,false)+'</div>'+
     '<div class="tile"><span class="v">'+(last&&last.f!=null?last.f+"<span style=\"font-size:14px;font-weight:500\">%</span>":"–")+'</span><span class="k">Body fat</span>'+delta("f",1,true)+'</div>'+
     '<div class="tile"><span class="v">'+(last&&last.h!=null?last.h+"<span style=\"font-size:14px;font-weight:500\">%</span>":"–")+'</span><span class="k">Water</span>'+delta("h",1,false)+'</div>'+
     '</div>';

  /* weight + muscle */
  var wp=m.filter(function(r){return r.w!=null;}).map(function(r){return {d:r.date,v:r.w};});
  var mp=m.filter(function(r){return r.mm!=null;}).map(function(r){return {d:r.date,v:r.mm};});
  h+='<div class="card"><h2>Weight (kg)</h2>'+(wp.length<2?'<p class="empty">Two weigh-ins and this fills in.</p>':lineChart([{pts:wp,color:"var(--blue)"}],{h:150}))+'</div>';
  h+='<div class="card"><h2>Muscle mass (kg)</h2>'+(mp.length<2?'<p class="empty">Two weigh-ins and this fills in.</p>':lineChart([{pts:mp,color:"var(--green)"}],{h:150}))+'</div>';

  /* body fat */
  var fp=m.filter(function(r){return r.f!=null;}).map(function(r){return {d:r.date,v:r.f};});
  h+='<div class="card"><h2>Body fat %</h2>'+(fp.length<2?'<p class="empty">Two readings needed.</p>':lineChart([{pts:fp,color:"var(--orange)"}]))+'</div>';

  /* sessions per week */
  h+='<div class="card"><h2>Sessions per week</h2>';
  var bars=[],mon0=monday(iso(new Date()));
  for(var i=7;i>=0;i--){ var mn=addDays(mon0,-7*i); bars.push({k:parse(mn).getDate()+"/"+(parse(mn).getMonth()+1),v:sessionsInWeek(mn).total}); }
  h+=barChart(bars,6)+'<p class="note">Dashed line is the full six. Two lifts and a run still counts as a good week.</p></div>';

  /* strength */
  h+='<div class="card"><h2>Key lifts</h2>';
  var track=["Flat bench press","Incline bench press","One-arm row","Goblet squat"], series=[], colors=["var(--blue)","var(--green)","var(--orange)","#BF8EDA"], any=false, ci=0, legend="";
  track.forEach(function(name){
    var pts=[];
    Object.keys(s.sessions).sort().forEach(function(d){
      var e=s.sessions[d]; if(e&&e.done&&e.ex&&e.ex[name]&&e.ex[name].w) pts.push({d:d,v:+e.ex[name].w});
    });
    if(pts.length>1){ any=true; series.push({pts:pts,color:colors[ci]}); legend+='<span><i style="background:'+colors[ci]+'"></i>'+esc(name)+'</span>'; ci++; }
  });
  h+= any ? lineChart(series)+'<div class="legend">'+legend+'</div>'
          : '<p class="empty">Log a couple of lift sessions and your working weights plot here.</p>';
  h+='</div>';

  h+='<div class="card"><h2>Backup</h2><p class="sub">Everything lives on this device only. Export now and then.</p>'+
     '<button class="btn ghost small" id="exp">Export JSON</button>'+
     '<label for="restore" style="margin-top:16px">Restore from a backup file</label><input type="file" id="restore" accept=".json,application/json" style="font-size:14px"></div>';
  return h;
}

function viewPlan(){
  var d=iso(new Date()), ph=phase(d), h="";
  h+='<div class="top"><div><h1>The plan</h1><p class="sub">'+esc(phaseLabel(d))+'</p></div></div>';
  h+='<div class="card"><h2>Typical week</h2>';
  var mon=monday(d);
  for(var i=0;i<7;i++){
    var dd=addDays(mon,i), sk=sessionFor(dd), t, m;
    if(sk.kind==="rest"){ t="Rest"; m="Walk if you feel like it"; }
    else if(sk.kind==="lift"){ t=LIFTS[sk.lift].name; m=LIFTS[sk.lift].ex.slice(0,3).map(function(e){return e.n;}).join(" · ")+" …"; }
    else { t=RUNS[sk.run].name; m=RUNS[sk.run].detail; }
    h+='<div class="sched"><b>'+["Mon","Tue","Wed","Thu","Fri","Sat","Sun"][i]+'</b><div class="t">'+esc(t)+'<div class="m">'+esc(m)+'</div></div></div>';
  }
  h+='</div>';
  h+='<div class="card"><h2>Phases</h2>'+
     '<div class="sched"><b>P1</b><div class="t">Wedding sprint<div class="m">28 Sep – 25 Oct · lean out, learn the lifts</div></div></div>'+
     '<div class="sched"><b>P2</b><div class="t">Strength &amp; definition<div class="m">26 Oct – 20 Dec · chest and arms, maintenance calories</div></div></div>'+
     '<div class="sched"><b>Dec</b><div class="t">Maintenance<div class="m">From 21 Dec · two lifts, one run, no guilt</div></div></div>'+
     '</div>';
  h+='<div class="card"><h2>Rules that keep it going</h2>'+
     '<div class="sched"><b>1</b><div class="t">Never miss twice<div class="m">One skip is noise. Two in a row is a slide.</div></div></div>'+
     '<div class="sched"><b>2</b><div class="t">Ten-minute rule<div class="m">Warm-up and the first set. You will finish.</div></div></div>'+
     '<div class="sched"><b>3</b><div class="t">Add weight when the top rep lands<div class="m">Clean form on every set, then +1–2 kg.</div></div></div>'+
     '<div class="sched"><b>4</b><div class="t">Any niggle, the run becomes a row<div class="m">No session is worth a six-week layoff.</div></div></div>'+
     '</div>';
  h+='<p class="note" style="text-align:center;padding-bottom:8px">Protein 130–150 g/day · 2.5–3 L water</p>';
  return h;
}

/* ---------------- wiring ---------------- */
function render(){
  var el=document.getElementById("app");
  el.innerHTML = tab==="today"?viewToday(): tab==="body"?viewBody(): tab==="progress"?viewProgress(): viewPlan();
  window.scrollTo(0,0);
  [].forEach.call(document.querySelectorAll("nav button"),function(b){ b.classList.toggle("on",b.dataset.tab===tab); });
  bind();
}
function bind(){
  [].forEach.call(document.querySelectorAll(".day"),function(b){ b.onclick=function(){ sel=b.dataset.d; render(); }; });

  function stash(){
    var s=load(), ses=sessionFor(sel), e=s.sessions[sel]||{};
    e.kind=ses.kind; e.id=ses.id; if(e.done===undefined) e.done=false;
    if(ses.kind==="lift"){
      e.ex=e.ex||{};
      [].forEach.call(document.querySelectorAll("[data-ex]"),function(inp){
        var n=inp.dataset.ex; e.ex[n]=e.ex[n]||{};
        if(inp.value!==""){ e.ex[n][inp.dataset.f]=+inp.value; if(inp.dataset.f==="w") s.weights[n]=+inp.value; }
      });
    } else {
      var k=document.getElementById("rk"), t=document.getElementById("rt");
      if(k&&k.value!=="") e.km=+k.value; if(t&&t.value!=="") e.min=+t.value;
    }
    s.sessions[sel]=e; save();
  }
  [].forEach.call(document.querySelectorAll("[data-ex],#rk,#rt"),function(inp){ inp.onchange=stash; });

  var mark=document.getElementById("mark");
  if(mark) mark.onclick=function(){
    stash(); var s=load(); s.sessions[sel].done=true; save(); render();
  };
  var undo=document.getElementById("undo");
  if(undo) undo.onclick=function(){ var s=load(); if(s.sessions[sel]){ s.sessions[sel].done=false; save(); } render(); };

  var sv=document.getElementById("saveM");
  if(sv) sv.onclick=function(){
    var s=load(), d=document.getElementById("md").value||iso(new Date());
    function val(id){ var v=document.getElementById(id).value; return v===""?null:+v; }
    var rec={date:d,w:val("mw"),f:val("mf"),mm:val("mm"),h:val("mh")};
    if(rec.w==null&&rec.f==null&&rec.mm==null&&rec.h==null) return;
    s.metrics=s.metrics.filter(function(r){return r.date!==d;}); s.metrics.push(rec); save(); tab="progress"; render();
  };
  [].forEach.call(document.querySelectorAll("[data-del]"),function(b){
    b.onclick=function(){ var s=load(); s.metrics=s.metrics.filter(function(r){return r.date!==b.dataset.del;}); save(); render(); };
  });

  var imp=document.getElementById("imp");
  if(imp) imp.onchange=function(){
    var f=imp.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){ var msg=document.getElementById("impMsg");
      try{ var n=ingest(rd.result,f.name); save(); msg.textContent=n?("Imported "+n+" reading"+(n===1?"":"s")+"."):"No body measurements found in that file."; if(n) render(); }
      catch(err){ msg.textContent="Could not read that file."; }
    };
    rd.readAsText(f);
  };

  var ex=document.getElementById("exp");
  if(ex) ex.onclick=function(){
    var blob=new Blob([JSON.stringify(load(),null,2)],{type:"application/json"}), a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="training-backup-"+iso(new Date())+".json"; a.click();
  };
  var rs=document.getElementById("restore");
  if(rs) rs.onchange=function(){
    var f=rs.files[0]; if(!f) return; var rd=new FileReader();
    rd.onload=function(){ try{ var j=JSON.parse(rd.result); mem=j; mem.sessions=mem.sessions||{}; mem.metrics=mem.metrics||[]; mem.weights=mem.weights||{}; save(); render(); }catch(e){} };
    rd.readAsText(f);
  };
}

/* CSV / JSON ingest — tolerant of Apple Health export shapes */
function ingest(txt,name){
  var s=load(), added=0, rows=[];
  if(/\.json$/i.test(name)||/^\s*[\[{]/.test(txt)){
    var j=JSON.parse(txt);
    var arr=Array.isArray(j)?j:(j.data&&j.data.metrics)?j.data.metrics:(j.metrics||[]);
    if(arr.length&&arr[0].name&&arr[0].data){ /* Health Auto Export metric shape */
      var byDate={};
      arr.forEach(function(metric){
        var key=matchKey(metric.name); if(!key) return;
        (metric.data||[]).forEach(function(p){
          var d=(p.date||"").slice(0,10); if(!d) return;
          byDate[d]=byDate[d]||{date:d}; byDate[d][key]=round(p.qty!==undefined?p.qty:p.value);
        });
      });
      rows=Object.keys(byDate).map(function(k){return byDate[k];});
    } else if(Array.isArray(j)){ rows=j.map(normaliseObj).filter(Boolean); }
  } else {
    var lines=txt.split(/\r?\n/).filter(function(l){return l.trim();});
    if(lines.length<2) return 0;
    var head=splitCsv(lines[0]), idx={};
    head.forEach(function(hh,i){ var k=matchKey(hh); if(k&&idx[k]===undefined) idx[k]=i;
      if(/date|time/i.test(hh)&&idx.date===undefined) idx.date=i; });
    if(idx.date===undefined) return 0;
    for(var i=1;i<lines.length;i++){
      var c=splitCsv(lines[i]), d=(c[idx.date]||"").trim();
      var mth=d.match(/(\d{4})-(\d{2})-(\d{2})/); if(mth) d=mth[0]; else { var dd=new Date(d); if(isNaN(dd)) continue; d=iso(dd); }
      var rec={date:d};
      ["w","f","mm","h"].forEach(function(k){ if(idx[k]!==undefined&&c[idx[k]]!==undefined&&c[idx[k]]!=="") rec[k]=round(parseFloat(c[idx[k]])); });
      if(rec.w!=null||rec.f!=null||rec.mm!=null||rec.h!=null) rows.push(rec);
    }
  }
  rows.forEach(function(r){
    if(!r||!r.date) return;
    var e=null; s.metrics.forEach(function(x){ if(x.date===r.date) e=x; });
    if(e){ ["w","f","mm","h"].forEach(function(k){ if(r[k]!=null) e[k]=r[k]; }); }
    else s.metrics.push({date:r.date,w:r.w!=null?r.w:null,f:r.f!=null?r.f:null,mm:r.mm!=null?r.mm:null,h:r.h!=null?r.h:null});
    added++;
  });
  return added;
}
function normaliseObj(o){
  var r={date:(o.date||o.Date||"").slice(0,10)}; if(!r.date) return null;
  Object.keys(o).forEach(function(k){ var m=matchKey(k); if(m&&o[k]!==""&&o[k]!=null) r[m]=round(parseFloat(o[k])); });
  return (r.w!=null||r.f!=null||r.mm!=null||r.h!=null)?r:null;
}
function matchKey(hh){
  var k=String(hh).toLowerCase();
  if(/fat/.test(k)) return "f";
  if(/lean|muscle/.test(k)) return "mm";
  if(/water|hydration/.test(k)) return "h";
  if(/weight|body mass/.test(k)&&!/lean/.test(k)) return "w";
  return null;
}
function round(v){ return (v==null||isNaN(v))?null:Math.round(v*10)/10; }
function splitCsv(line){
  var out=[],cur="",q=false;
  for(var i=0;i<line.length;i++){ var ch=line[i];
    if(ch==='"'){ if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q; }
    else if(ch===","&&!q){ out.push(cur); cur=""; }
    else cur+=ch; }
  out.push(cur); return out;
}

[].forEach.call(document.querySelectorAll("nav button"),function(b){
  b.onclick=function(){ tab=b.dataset.tab; if(tab==="today") sel=iso(new Date()); render(); };
});
render();
</script>
